# Runs the same image CI publishes to GitHub Container Registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectdesk
  namespace: projectdesk
  labels:
    app.kubernetes.io/name: projectdesk
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: projectdesk
  # Zero-downtime updates: start one new pod before stopping an old one.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projectdesk
    spec:
      containers:
        - name: web
          image: ghcr.io/vishi-vishnu/projectdesk:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: projectdesk-config
          # Readiness: only send traffic once nginx answers.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Liveness: restart the container if nginx stops answering.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
