# Run the production image locally:
#   docker compose up --build      then open http://localhost:8080
# The image has the public Firebase web config built in; /api/ calls are
# forwarded to the Vercel functions (API_ORIGIN).
services:
  web:
    build: .
    image: projectdesk:local
    ports:
      - "8080:8080"
    environment:
      API_ORIGIN: ${API_ORIGIN:-https://projectdesk-three.vercel.app}
    restart: unless-stopped
