# Run the production build locally in the same nginx image CI publishes:
#   docker compose up --build      then open http://localhost:8080
# Build args are read from your .env file (the Firebase web config is public).
services:
  web:
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_STORAGE_PROVIDER: ${VITE_STORAGE_PROVIDER:-firebase}
    image: projectdesk:local
    ports:
      - "8080:8080"
    restart: unless-stopped
