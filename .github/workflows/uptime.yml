name: Uptime check

# Every 6 hours, ask the live site's /api/health whether it is up and fully
# configured. A failed run sends GitHub's usual failure email.
# Set the repository variable LIVE_URL (Settings > Secrets and variables >
# Actions > Variables), for example https://projectdesk-three.vercel.app
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/health
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$LIVE_URL" ]; then echo "LIVE_URL is not set, skipping."; exit 0; fi
          code=$(curl -s -o body.json -w '%{http_code}' --max-time 20 "$LIVE_URL/api/health")
          cat body.json; echo
          test "$code" = 200
