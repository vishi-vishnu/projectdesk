name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    name: Docker image (build, run, publish)
    needs: [quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: projectdesk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the container and check it serves the app
        run: |
          docker run -d --name web -p 8080:8080 projectdesk:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/teams/any)" = 200
          docker image ls projectdesk:ci --format 'Image size: {{.Size}}'
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag projectdesk:ci "$IMAGE:latest"
          docker tag projectdesk:ci "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy-rules:
    name: Deploy Firestore rules & indexes
    needs: [quality, rules, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CREDENTIALS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_CREDENTIALS == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Deploy
        if: env.HAS_CREDENTIALS == 'true'
        run: |
          npm ci
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@15.32.0 deploy --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" --non-interactive
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      - name: Skipped
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT secret not set, skipping rules deploy."
